<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN Reader - Your Personalized Hacker News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📰 HN Reader</h1>
            <p class="subtitle">Your personalized Hacker News feed</p>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <button id="refreshBtn" class="btn">🔄 Refresh</button>
            <div class="loading" id="loading">Loading stories...</div>
        </div>

        <div id="stories" class="stories-container">
            <!-- Stories will be loaded here -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Powered by <a href="https://github.com/HackerNews/API" target="_blank">Hacker News API</a></p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
